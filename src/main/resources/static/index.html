<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interview Scheduler</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!--
    Single-page app: app.js swaps the content of <main> based on the URL hash (#/slots, #/book/7, ...)
    and talks to the Spring Boot JSON API with fetch(). Login uses the server-side session cookie.
  -->
  <nav class="navbar navbar-expand-md border-bottom app-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/">Interview Scheduler</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
              aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navLinks">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-3">
          <li class="nav-item"><a class="nav-link fw-semibold" href="#/slots">Browse Slots</a></li>
          <li class="nav-item" data-role="CUSTOMER" hidden>
            <a class="nav-link fw-semibold" href="#/appointments">My Appointments</a></li>
          <li class="nav-item" data-role="PROVIDER" hidden>
            <a class="nav-link fw-semibold" href="#/provider">My Availability</a></li>
          <li class="nav-item" data-when="out"><a class="btn btn-outline-dark" href="#/login">Log in</a></li>
          <li class="nav-item d-flex align-items-center gap-2" data-when="in" hidden>
            <span class="small text-secondary" id="whoami"></span>
            <button class="btn btn-outline-dark btn-sm" id="logoutBtn" type="button">Log out</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-3" id="flash" aria-live="polite"></div>
  <main class="container py-4" id="view"></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
