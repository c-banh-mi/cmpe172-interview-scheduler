services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: ${DB_USERNAME:-scheduler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:5432:5432"   # reachable only from this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/scheduler
      # Match the developer's local date. The JVM time zone becomes the DB session
      # time zone, which CURRENT_DATE in seed.sql and the date filter depend on.
      TZ: America/Los_Angeles
      DB_USERNAME: ${DB_USERNAME:-scheduler}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "8080:8080"
